<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPrepStudio | Launching Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      /* Replace logo.png with your exact image file name */
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('VPrePStudio.logo.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
    }
    .container {
      max-width: 600px;
      width: 90%;
      padding: 40px 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .tagline {
      font-size: 1.2rem;
      color: #f0f0f0;
      margin-bottom: 24px;
      font-weight: 400;
    }
    .launch-notice {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #ffd700;
    }
    .subtext {
      font-size: 1.1rem;
      margin-bottom: 24px;
      color: #eaeaea;
    }
    .instagram-link {
      display: inline-block;
      margin-bottom: 24px;
      font-weight: 600;
      color: #ff69b4;
      text-decoration: none;
      font-size: 1.1rem;
    }
    .instagram-link:hover {
      text-decoration: underline;
    }
    .footer-status {
      font-size: 1rem;
      color: #dddddd;
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>VPrepStudio</h1>
    <p class="tagline">Personalized Gifts • Jewelry • Keepsakes</p>
    
    <p class="launch-notice">✨ Launching Soon....!!! ✨</p>
    <p class="subtext">crafted with Love, Made just for you ❤️</p>
    
    <p>
      Follow us on Instagram: 
      <a class="instagram-link" href="https://www.instagram.com/vprepstudio" target="_blank" rel="noopener noreferrer">
        @vprepstudio
      </a>
    </p>

    <div class="footer-status">
      🌐 Website Coming Soon
    </div>
  </div>

</body>
</html>
